[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fishinglog-agent"
version = "0.1.0"
description = "Captain's Mate for fishinglog.ai - PLATO-based fishing log agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Cocapn Fleet", email = "fleet@cocapn.com" }
]
keywords = ["fishing", "plato", "fleet", "logging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/fishinglog-agent"
Repository = "https://github.com/SuperInstance/fishinglog-agent"
Issues = "https://github.com/SuperInstance/fishinglog-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["fishinglog_agent"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"